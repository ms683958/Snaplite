/* ---- stories ---- */

function snx(d){clearTimeout(ST);SI+=d;const s=SQ[SI];if(!s){$('#sv').style.display='none';$('#sv-b').innerHTML='';render();return}const p=P[s.user_id]||{};sn[s.user_id]=Math.max(sn[s.user_id]||0,Date.parse(s.created_at));SV('sl_seen',sn);
$('#sv-h').innerHTML=av(p.avatar,36)+`<b>${esc(p.name)}</b>${vb(p)}<span class="mut">${ago(s.created_at)} ago</span>`;
$('#sv-b').innerHTML=s.kind=='video'?`<video src="${esc(s.media_url)}" autoplay playsinline muted onended="snx(1)"></video>`:`<img src="${esc(s.media_url)}" alt="">`;ST=setTimeout(()=>snx(1),s.kind=='video'?30000:5000)}
/* ---- spotlight ---- */
function spot(){$('#sp').style.display='block';rsp()}
function rsp(){const fl=new Set(FOL.filter(f=>f.follower_id==S.uid).map(f=>f.followee_id)),ps=POSTS.filter(p=>p.place=='spotlight'&&(SP=='you'||fl.has(p.user_id)));
$('#sp').innerHTML=`<button class="ib sx" onclick="$('#sp').style.display='none'" aria-label="Close">✕</button><div class="tabs"><button class="${SP=='you'?'on':''}" onclick="SP='you';rsp()">For you</button><button class="${SP=='fol'?'on':''}" onclick="SP='fol';rsp()">Following</button></div><div class="sl">`+(ps.length?ps.map(p=>{const u=P[p.user_id]||{},n=LIKES.filter(l=>l.post_id==p.id).length,me=LIKES.some(l=>l.post_id==p.id&&l.user_id==S.uid),f=fl.has(p.user_id);return `<section class="si">${p.kind=='video'?`<video src="${esc(p.media_url)}" muted loop playsinline onclick="this.muted=!this.muted"></video>`:`<img src="${esc(p.media_url)}" alt="">`}<div class="mt"><b>@${esc(u.username)}</b>${vb(u)}<div>${esc(p.caption)}</div></div><div class="rail"><button class="sm${me?'':' o'}" onclick="like('${p.id}')">♥ ${n}</button>${p.user_id!=S.uid?`<button class="sm${f?'':' o'}" onclick="folw('${p.user_id}',${f})">${f?'Following':'Follow'}</button>`:''}</div></section>`}).join(''):'<p class="mut c" style="padding:40vh 24px 0">Nothing here yet.</p>')+'</div>';
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(v)e.isIntersecting?v.play().catch(()=>0):v.pause()}),{threshold:.6});document.querySelectorAll('.si').forEach(s=>io.observe(s))}
async function folw(id,f){try{if(f)await db(`follows?follower_id=eq.${S.uid}&followee_id=eq.${id}`,{m:'DELETE'});else await ins('follows',{follower_id:S.uid,followee_id:id});await refresh()}catch(e){alert(e.message)}}
/* ---- create ---- */
const vNew=()=>`<div class="pad"><h2>New post</h2><button class="btn" style="width:100%;margin:12px 0 10px" onclick="$('#f1').click()">Take a photo</button><button class="sm o" style="width:100%;padding:12px;margin-bottom:12px" onclick="$('#f2').click()">Choose photo or video</button><input id="f1" type="file" accept="image/*" capture="environment" hidden onchange="pick(this)"><input id="f2" type="file" accept="image/*,video/*" hidden onchange="pick(this)"><div id="pv"></div></div>`;
function pick(i){FL=i.files[0];if(!FL)return;if(FL.size>20971520){FL=null;$('#pv').innerHTML='<p class="err">That file is over 20 MB. Choose a smaller one.</p>';return}const v=FL.type.startsWith('video'),u=URL.createObjectURL(FL);$('#pv').innerHTML=(v?`<video class="m" src="${u}" controls playsinline></video>`:`<img class="m" src="${u}" alt="">`)+`<input id="cap" placeholder="Caption" maxlength="300"><select id="dest"><option value="feed">Post to Feed</option><option value="spotlight">Post to Spotlight</option><option value="story">Add to Story (24 hours)</option></select><p id="err" class="err"></p><button class="btn" style="width:100%" onclick="post(this)">Post</button>`;$('#dest').value=DEST!='feed'?DEST:v?'spotlight':'feed'}
async function post(bt){const e=$('#err');bt.disabled=true;bt.textContent='Posting…';try{const v=FL.type.startsWith('video'),url=await up(await shrink(FL),v),d=$('#dest').value,k=v?'video':'photo';if(d=='story')await ins('stories',{user_id:S.uid,media_url:url,kind:k});else await ins('posts',{user_id:S.uid,media_url:url,kind:k,caption:$('#cap').value.trim(),place:d});FL=null;await load();go('home')}catch(x){e.textContent=x.message;bt.disabled=false;bt.textContent='Post'}}
/* ---- chat ---- */
const last=()=>{const l={};MSG.forEach(m=>l[m.sender_id==S.uid?m.recipient_id:m.sender_id]=m);return l},unr=(l,id)=>l[id]&&l[id].sender_id!=S.uid&&Date.parse(l[id].created_at)>(rd[id]||0);
function vChat(){const l=last(),fr=FR.filter(f=>f.status=='accepted').map(f=>f.requester_id==S.uid?f.addressee_id:f.requester_id),ids=[...new Set([...Object.keys(l),...fr])].filter(id=>P[id]).sort((a,b)=>(l[b]?Date.parse(l[b].created_at):0)-(l[a]?Date.parse(l[a].created_at):0));
return '<h2 class="pad">Messages</h2>'+(ids.length?ids.map(id=>{const p=P[id],m=l[id];return `<div class="row" onclick="th('${id}')">${av(p.avatar,46)}<div class="mid"><b>${esc(p.name)}</b>${vb(p)}<div class="mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m?(m.sender_id==S.uid?'You: ':'')+esc(m.body):'Say hi'}</div></div>${unr(l,id)?'<i class="ud"></i>':''}</div>`}).join(''):'<p class="pad mut">Add friends first, then you can message them.</p>')}
function th(id){TH=id;rd[id]=Date.now();SV('sl_rd',rd);view='t';render()}
const vTh=()=>{const p=P[TH]||{};return `<div class="row"><button class="ib" onclick="go('chat')" aria-label="Back">←</button>${av(p.avatar,40)}<b>${esc(p.name)}</b>${vb(p)}</div><div id="bub" class="bub"></div><div class="sb"><input id="mi" placeholder="Message" maxlength="1000" onkeydown="if(event.key=='Enter')snd()"><button class="btn" onclick="snd()">Send</button></div>`};
function pb(){const b=$('#bub');if(!b)return;rd[TH]=Date.now();SV('sl_rd',rd);b.innerHTML=MSG.filter(m=>m.sender_id==TH||m.recipient_id==TH).map(m=>`<div class="b ${m.sender_id==S.uid?'me':''}">${esc(m.body)}<small>${ago(m.created_at)}</small></div>`).join('')||'<p class="mut c">Say hi 👋</p>';window.scrollTo(0,document.body.scrollHeight)}
async function snd(){const i=$('#mi'),b=i.value.trim();if(!b)return;i.value='';try{await ins('messages',{sender_id:S.uid,recipient_id:TH,body:b});await load();pb()}catch(e){i.value=b;alert(e.message)}}
/* ---- me ---- */
function vMe(){const c=FR.filter(f=>f.status=='accepted').length,fg=FOL.filter(f=>f.follower_id==S.uid).length,fw=FOL.filter(f=>f.followee_id==S.uid).length,rq=VQ.some(v=>v.user_id==S.uid);
return `<div class="pad c"><div style="display:flex;justify-content:center">${av(ME.avatar,104)}</div><h2 style="margin-top:10px">${esc(ME.name)}${vb(ME)}</h2><div style="color:var(--g)">@${esc(ME.username)}</div><p>${esc(ME.bio)}</p><div class="stats"><div><b>${c}</b><span>Friends</span></div><div><b>${fg}</b><span>Following</span></div><div><b>${fw}</b><span>Followers</span></div></div><button class="btn" onclick="go('edit')">Edit profile and avatar</button><h3 style="margin:24px 0 8px">Appearance</h3>`+(ME.verified?'<div class="opts">'+THS.map(t=>`<button class="sm${ME.theme==t?'':' o'}" onclick="setTh('${t}')">${t}</button>`).join('')+'</div>':'<p class="mut">Themes are for verified accounts.</p>')+(ME.verified?'':ADMIN?`<button class="sm" style="margin-top:14px" onclick="ver('${S.uid}',true)">Verify my account</button>`:`<button class="sm o" style="margin-top:14px" ${rq?'disabled':''} onclick="reqv()">${rq?'Badge requested':'Request verified badge'}</button>`)+'<br><button class="sm o" style="margin-top:24px" onclick="out()">Log out</button></div>'}
async function setTh(t){try{await pat('profiles?id=eq.'+S.uid,{theme:t});await refresh()}catch(e){alert(e.message)}}
async function reqv(){try{await ins('verification_requests',{user_id:S.uid});await refresh()}catch(e){alert(e.message)}}
/* ---- notifications ---- */
function notes(){const n=[],t=Date.parse,my=new Set(POSTS.filter(p=>p.user_id==S.uid).map(p=>p.id));
FR.forEach(f=>{if(f.addressee_id==S.uid&&f.status=='pending')n.push([t(f.created_at),f.requester_id,'sent you a friend request','fr']);if(f.requester_id==S.uid&&f.status=='accepted')n.push([t(f.created_at),f.addressee_id,'is now your friend','fr'])});
LIKES.forEach(l=>{if(my.has(l.post_id)&&l.user_id!=S.uid)n.push([t(l.created_at),l.user_id,'liked your post','home'])});
FOL.forEach(f=>{if(f.followee_id==S.uid)n.push([t(f.created_at),f.follower_id,'followed you','fr'])});
const lm={};MSG.forEach(m=>{if(m.recipient_id==S.uid)lm[m.sender_id]=m});Object.values(lm).forEach(m=>n.push([t(m.created_at),m.sender_id,'sent you a message','chat']));
if(ADMIN)VQ.forEach(v=>{if(!(P[v.user_id]||{}).verified)n.push([t(v.created_at),v.user_id,'asked for a verified badge','fr'])});
return n.filter(x=>x[0]>Date.now()-6048e5).sort((a,b)=>b[0]-a[0]).slice(0,40)}
function nts(){const l=LS('sl_n',0);$('#nt').innerHTML=`<button class="ib sx" onclick="$('#nt').style.display='none'" aria-label="Close">✕</button><div style="padding:calc(70px + env(safe-area-inset-top)) 0 30px"><h2 class="pad">Notifications</h2>`+(notes().map(x=>{const p=P[x[1]]||{};return `<div class="row" onclick="$('#nt').style.display='none';go('${x[3]}')">${av(p.avatar,44)}<div class="mid"><b style="font-weight:${x[0]>l?800:400}">${esc(p.name||'Someone')} ${x[2]}</b><div class="mut">${ago(x[0])} ago</div></div>${x[0]>l?'<i class="ud"></i>':''}</div>`}).join('')||'<p class="pad mut">Nothing yet. Friend requests, likes, messages and followers show up here.</p>')+'</div>';$('#nt').style.display='block';SV('sl_n',Date.now());render()}
/* ---- shell ---- */
function go(v,d){view=v;if(v=='new')DEST=d||'feed';if(v=='edit')AV={...(ME.avatar||{})};render();scrollTo(0,0)}
function render(){const a=$('#app');if(!S){a.innerHTML=vAuth();return}if(view=='setup'){AV=Object.keys(AV).length?AV:{s:1,h:1,hc:0,o:0,b:0,g:0};a.innerHTML=vEd(1);ed();return}if(view=='edit'){a.innerHTML=vEd(0);ed();return}if(!ME)return;
const v=view,h=v=='home'?vHome():v=='fr'?vFr():v=='new'?vNew():v=='chat'?vChat():v=='me'?vMe():vTh(),l=last(),
nd=notes().some(x=>x[0]>LS('sl_n',0)),fd=FR.some(f=>f.status=='pending'&&f.addressee_id==S.uid),cd=Object.keys(l).some(id=>unr(l,id)),
nb=(k,i,t,dt)=>`<button class="${v==k?'on':''}" onclick="go('${k}')"><b>${i}</b>${t}${dt?'<i class="ud" style="position:absolute;top:2px;right:12px;width:9px;height:9px"></i>':''}</button>`;
a.innerHTML=`<header><div class="logo">${LOGO}Snap<i>lite</i></div><div style="display:flex;gap:8px"><button class="ib" onclick="spot()" aria-label="Spotlight">✦</button><button class="ib${nd?' dot':''}" onclick="nts()" aria-label="Notifications">🔔</button></div></header><main>${h}</main><nav>${nb('home','⌂','Home')}${nb('fr','☺','Friends',fd)}<button class="pl" onclick="go('new')" aria-label="Create post"><b>+</b></button>${nb('chat','✉','Chat',cd)}${nb('me','◉','Profile')}</nav>`;if(v=='t')pb()}
if(S)boot();else render();
</script></body></html>
